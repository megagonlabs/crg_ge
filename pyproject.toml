[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[project]
name = "crg_ce"
version = "0.0.1"
description = "A confidence estimation method for multi-agent systems"
readme = "README.md"
license = "LicenseRef-Megagon-BSD-3-Clause-Attribution"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [
    { name = "Brendan King", email = "brendan@megagon.ai" },
]
keywords = [""]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "datasets>=5.0.0",
    "jinja2>=3.1.6",
    "litellm>=1.89.3",
    "matplotlib>=3.11.0",
    "numpy>=2.0.0",
    "openai>=2.0.0",
    "openhands-agent-server==1.31.0",
    "openhands-sdk==1.31.0",
    "openhands-tools==1.31.0",
    "openhands-workspace==1.31.0",
    "pandas>=3.0.5",
    "pgmpy>=1.1.2",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.5",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "tenacity>=9.0.0",
    "tqdm>=4.70.0",
]

[project.scripts]
batch_run_ce = "crg_ce.experiments.batch_run_estimate_confidence:cli"
batch_run_gqa_local = "crg_ce.experiments.batch_run_gqa_local:cli"
copy_exp = "crg_ce.experiments.manage_experiment:copy_cli"
move_exp = "crg_ce.experiments.manage_experiment:move_cli"
parse_results = "crg_ce.experiments.parse_results:cli"
ece_sweep = "crg_ce.experiments.ece_sweep:cli"
parse_gqa_results = "crg_ce.experiments.parse_gqa_results:cli"
generate_partial_metrics = "crg_ce.experiments.generate_partial_metrics:cli"

[dependency-groups]
dev = [
    "dictdiffer~=0.9.0",
    "pytest>=7.0.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
    "jupyter>=1.1.1",
    "pandas-stubs>=3.0.3.260530",
    "types-pyyaml>=6.0.12.20260518",
    "types-tqdm>=4.68.0.20260608",
    "tabulate>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/megagonlabs/crg_ge"
Repository = "https://github.com/megagonlabs/crg_ge"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "crg_ce"
module-root = "src"
# Keep locally supplied benchmark fixtures out of source and wheel distributions.
source-exclude = [
    "src/crg_ce/utils/test_data",
    "src/crg_ce/estimators/openhands/test_data/qwen_log_probs_estimator",
    "src/crg_ce/estimators/openhands/test_data/litellm_verbal_prompts/enterprise-ops-gym.txt",
    "src/crg_ce/estimators/openhands/test_data/litellm_verbal_prompts/swe-smith.txt",
    "src/crg_ce/graph/graph_generators/gsn/test_data/agentic_goal_decomposer_user_prompt_first_3_actions.txt",
    "src/crg_ce/graph/graph_generators/gsn/test_data/litellm_expected_*",
    "src/crg_ce/graph/graph_generators/gsn/test_data/v3_3_agentic_graph_estimation/*/evidence_confidence_prompt.txt",
    "src/crg_ce/graph/graph_generators/gsn/test_data/v3_3_agentic_graph_estimation/*/goal_confidence_prompt.txt",
    "src/crg_ce/graph/graph_generators/gsn/test_data/v3_3_agentic_graph_generation/*/goal_decomposition_prompt.txt",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit_build: marks tests as unit build tests (run with: pytest -m unit_build)",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow-running",
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
follow_imports = "normal"
disable_error_code = ["import-untyped"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["crg_ce"]
