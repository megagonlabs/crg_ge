# Replay test-set predictions with the validation-learned ask-and-parse temperature.
dataset:
  path: Brendan/openhands_ce_data_skillsbench_44_v2
  split: test
estimator:
  estimator_type: replay
  replay_from: runs/test_set/skillsbench_44_v2/baselines/ask_and_parse/qwen38_27b_medium.yaml
  calibration:
    mode: temperature
    calibrate_from: runs/dev_set/baselines/ask_and_parse/qwen38_27b_medium.yaml
    allow_learn: false
max_workers: 32
