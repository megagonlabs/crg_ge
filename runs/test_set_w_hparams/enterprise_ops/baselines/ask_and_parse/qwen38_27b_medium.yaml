# Replay test-set predictions with the validation-learned ask-and-parse temperature.
dataset:
  path: Brendan/openhands_ce_data_enterprise_ops
  split: test
estimator:
  estimator_type: replay
  replay_from: runs/test_set/enterprise_ops/baselines/ask_and_parse/qwen38_27b_medium.yaml
  calibration:
    mode: temperature
    calibrate_from: runs/dev_set/baselines/ask_and_parse/qwen38_27b_medium.yaml
    allow_learn: false
max_workers: 32
