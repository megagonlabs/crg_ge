# Ex-situ LiteLLM baseline that estimates confidence from ten sampled True/False judgments.
dataset:
  path: Brendan/openhands_ce_data_enterprise_ops
  split: test
  slice: "0:8"
execution_mode: async
estimator:
  estimator_type: litellm_verbal
  litellm:
    query_type: sampled_true_or_false
    true_or_false_samples: 10
    domain_success_criteria:
      by_benchmark:
        swe-bench: prompts/domains/swe/agent_success_criteria.txt
        enterprise-ops-gym: prompts/domains/enterprise/agent_success_criteria.txt
        skillsbench: prompts/domains/skillsbench/agent_success_criteria.txt
    agent:
      max_concurrent_llm_calls: 4
      model_name: openai/Qwen/Qwen3.8-27B-FP8
      api_base: http://localhost:21046/v1
      reasoning_effort: medium
      top_p: 0.95
      completion_kwargs:
        temperature: 1.0
        top_k: 20
        presence_penalty: 0
        min_p: 0.0
        repetition_penalty: 1.0
max_workers: 6
