# Ex-situ LiteLLM confidence-estimation baseline that reasons as a graph with Qwen 3.8 medium reasoning.
dataset:
  path: Brendan/openhands_ce_data_skills_bench
  split: test
  slice: "0:8"
estimator:
  estimator_type: litellm_verbal
  litellm:
    instruction_template: prompts/confidence_estimation/litellm/reason_as_graph.j2
    query_type: ask_and_parse
    verbalization:
      scale_min: 0
      scale_max: 100
      scale_suffix: "%"
    domain_success_criteria:
      by_benchmark:
        swe-smith: prompts/domains/swe/agent_success_criteria.txt
        enterprise-ops-gym: prompts/domains/enterprise/agent_success_criteria.txt
        skillsbench: prompts/domains/skillsbench/agent_success_criteria.txt
    agent:
      model_name: openai/Qwen/Qwen3.8-27B-FP8
      api_base: http://localhost:21046/v1
      reasoning_effort: xhigh
      timeout: 1200
      top_p: 0.95
      completion_kwargs:
        temperature: 1.0
        top_k: 20
        presence_penalty: 0
        min_p: 0.0
        repetition_penalty: 1.0
max_workers: 16
