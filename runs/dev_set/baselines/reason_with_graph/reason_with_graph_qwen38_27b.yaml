# Plain verbalized GSN graph confidence-estimation baseline.
dataset:
  path: Brendan/openhands_ce_data_dev
  split: valid
estimator:
  estimator_type: gsn_plain_verbalized
  load_graphs_from_path: outputs/runs/dev_set/ours/qwen38_27b_agentic_fp8_max_depth_5
  agent:
    model_name: openai/Qwen/Qwen3.8-27B-FP8
    api_base: http://localhost:21046/v1
    tools_preset: default
    reasoning_effort: medium
    top_p: 0.95
    completion_kwargs:
      temperature: 1.0
      top_k: 20
      presence_penalty: 0
      min_p: 0.0
      repetition_penalty: 1.0
max_workers: 16
