# Replay Qwen graph-confidence test predictions with its final_valid_v2-learned NLL temperature.
dataset:
  path: Brendan/openhands_ce_data_skills_bench
  split: test
estimator:
  estimator_type: replay
  replay_from: runs/test_set/skills_bench/ours/qwen38_27b_agentic_fp8_max_depth_5.yaml
  calibration:
    mode: temperature
    calibrate_from: runs/dev_set/ours/qwen38_27b_agentic_fp8_max_depth_5.yaml
    allow_learn: false
max_workers: 32
