# Learn an NLL temperature from the completed final_valid_v2 Qwen graph-confidence run.
dataset:
  path: Brendan/openhands_ce_data_dev
  split: valid
estimator:
  estimator_type: replay
  replay_from: runs/dev_set/ours/qwen38_27b_agentic_fp8_max_depth_5.yaml
  calibration:
    mode: temperature
    calibrate_from: runs/dev_set/ours/qwen38_27b_agentic_fp8_max_depth_5.yaml
    allow_learn: true
max_workers: 32
