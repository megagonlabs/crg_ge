# Learn an NLL temperature from the completed final_valid_v2 reason-as-graph run.
dataset:
  path: Brendan/openhands_ce_data_dev
  split: valid
estimator:
  estimator_type: replay
  replay_from: runs/dev_set/baselines/reason_as_graph/qwen38_27b_medium.yaml
  calibration:
    mode: temperature
    calibrate_from: runs/dev_set/baselines/reason_as_graph/qwen38_27b_medium.yaml
    allow_learn: true
max_workers: 32
