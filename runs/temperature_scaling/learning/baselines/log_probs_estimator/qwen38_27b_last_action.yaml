# Learn an NLL temperature from the completed final_valid_v2 last-action length-normalized sequence-probability run.
dataset:
  path: Brendan/openhands_ce_data_dev
  split: valid
estimator:
  estimator_type: replay
  replay_from: runs/dev_set/baselines/log_probs_estimator/qwen38_27b_last_action.yaml
  calibration:
    mode: temperature
    calibrate_from: runs/dev_set/baselines/log_probs_estimator/qwen38_27b_last_action.yaml
    allow_learn: true
max_workers: 32
